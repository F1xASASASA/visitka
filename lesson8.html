<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVG и анимация</title><link rel="stylesheet" href="lessons.css"><style>.svg-card svg{width:220px;height:150px}.recolor circle{transition:fill .3s}.recolor:hover circle{fill:#ff83bd}.balloon{transition:transform 1.5s ease-in-out}.balloon.fly{transform:translateY(-145px)}.sky{height:200px;overflow:hidden;background:linear-gradient(#343273,#8273b5);border-radius:12px;padding-top:140px}</style></head><body><main><header><a href="index.html">← На визитку</a><h1>SVG и анимация</h1><p>Рисунки и действия из презентации №8.</p></header><div class="grid">
<section class="card svg-card"><h2>Собственные фигуры</h2><svg viewBox="0 0 220 150" role="img" aria-label="Круг, скруглённый прямоугольник и звезда"><circle cx="45" cy="70" r="35" fill="#a88bfa"/><rect x="90" y="35" width="55" height="70" rx="15" fill="#f287b6"/><path d="M180 26l8 25 27 0-22 16 9 26-22-16-22 16 9-26-22-16 27 0z" fill="#f7cb75"/></svg></section>
<section class="card svg-card"><h2>Два смайлика</h2><svg viewBox="0 0 220 110" role="img" aria-label="Весёлый и грустный смайлики"><circle cx="55" cy="55" r="44" fill="#f7c85e"/><circle cx="165" cy="55" r="44" fill="#aac0ed"/><g fill="#252134"><circle cx="40" cy="45" r="4"/><circle cx="70" cy="45" r="4"/><circle cx="150" cy="45" r="4"/><circle cx="180" cy="45" r="4"/></g><path d="M32 64 Q55 88 78 64" fill="none" stroke="#252134" stroke-width="5"/><path d="M142 79 Q165 52 188 79" fill="none" stroke="#252134" stroke-width="5"/></svg></section>
<section class="card svg-card"><h2>Смена цвета при наведении</h2><svg class="recolor" viewBox="0 0 220 150" role="img" aria-label="Круг меняет цвет при наведении"><circle cx="110" cy="75" r="55" fill="#7a9fff"/></svg></section>
<section class="card"><h2>Летающий шарик</h2><div class="sky"><svg viewBox="0 0 110 130" width="100" height="120" class="balloon" id="balloon" role="img" aria-label="Воздушный шар"><ellipse cx="55" cy="45" rx="38" ry="43" fill="#f489bf"/><path d="M45 86l10 16 10-16M55 100v22" fill="none" stroke="#f9e8fa" stroke-width="3"/></svg></div><button id="fly" type="button">Лети</button></section>
</div></main><script>document.getElementById('fly').addEventListener('click',()=>{const b=document.getElementById('balloon');b.classList.remove('fly');void b.offsetWidth;b.classList.add('fly')})</script></body></html>
